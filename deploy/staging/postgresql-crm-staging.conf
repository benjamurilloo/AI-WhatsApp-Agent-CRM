# Parámetros de costo del planificador para staging (9.3, D-2).
# Destino: /etc/postgresql/18/main/conf.d/crm-staging.conf
#
# Por qué existe este archivo. Los valores por defecto de PostgreSQL describen una máquina que
# este droplet no es, y el entregable principal de la 9.3 es **la forma del plan**, que el
# planificador elige a partir de estos números. Medido el 2026-09-23, antes de tocar nada:
#
#   effective_cache_size = 4GB   en una máquina con 961 MB de RAM en total
#   random_page_cost     = 4     sobre SSD
#
# El primero le hace creer al planificador que casi todo está en caché y **abarata** los
# recorridos por índice. El segundo encarece el acceso aleatorio y lo empuja hacia **recorridos
# completos**. Que los dos errores apunten en direcciones opuestas es peor que uno solo: no se
# cancelan de forma conocida, así que sobre la configuración por defecto no se puede decir en qué
# dirección está sesgado un plan. Un `EXPLAIN` sin sus parámetros de costo no es reproducible.
#
# Se versiona en vez de aplicarse con `ALTER SYSTEM` porque `postgresql.auto.conf` vive solo en la
# máquina, y esa es exactamente la falla que la revisión independiente de la 9.1 marcó como mayor
# (H-1): una premisa de la que dependen las conclusiones, que no se puede auditar desde el
# repositorio ni detectar su regresión.

# Memoria que el planificador supone disponible para cachear, entre shared_buffers y la caché del
# sistema operativo. NO reserva memoria: es solo una estimación de costo.
#
# 600 MB y no los ~700 MB que estimó el brief: con la aplicación corriendo, `free -m` mide
# 602 MB de buff/cache y 503 MB disponibles sobre 961 MB totales. 600 MB es lo que la máquina
# tiene de verdad, no lo que entraría si no corriera nada más.
effective_cache_size = 600MB

# Costo de leer una página fuera de orden. El 4 por defecto es una relación 4:1 contra la lectura
# secuencial, pensada para disco mecánico con cabezal. En SSD la diferencia real es mucho menor.
random_page_cost = 1.1

# Lo que este archivo NO toca, a propósito:
#
# - `shared_buffers` (128 MB) queda como está. Es razonable para 961 MB, y subirlo le sacaría
#   memoria a la aplicación, que comparte la máquina con la base.
# - `work_mem` (4 MB) queda como está. Subirlo cambiaría qué ordenamientos se vuelcan a disco y
#   con eso los tiempos, y esta subfase mide la configuración que corre, no una optimizada.
# - Nada de esto es una recomendación para producción: ahí la máquina será otra y estos dos
#   números se vuelven a calcular. Lo que se lleva a producción es el método, no los valores.
