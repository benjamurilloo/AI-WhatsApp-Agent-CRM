# Proxy inverso de staging (brief-9.1). La aplicacion escucha solo en loopback.
server {
    server_name staging.vixoraai.app;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # REEMPLAZA, no agrega (brief-9.1, D-9). Con $proxy_add_x_forwarded_for una
        # cabecera falsificada por el cliente sobrevive en la cadena; con $remote_addr
        # hay exactamente una entrada y es la IP que vio nginx. La aplicacion lee la
        # ultima entrada (session-cookie.ts:38), asi que un solo salto es la premisa
        # de la que depende H-3: si algun dia se agrega otro proxy delante, esto se
        # revisa antes de desplegarlo.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # La subida de la imagen de un producto (brief-17.5, D-2): el unico lugar con un cuerpo de
    # hasta 6 MB. El resto sigue con el valor por defecto de nginx, 1 MB. La aplicacion corta en
    # 5 MB y comprueba la sesion, el rol y el Origin antes de leer el cuerpo. Repite las cabeceras
    # de `location /`: proxy_set_header se hereda solo si el bloque no declara ninguna.
    location ~ ^/productos/[0-9a-f-]+/imagen$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.vixoraai.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.vixoraai.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = staging.vixoraai.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name staging.vixoraai.app;
    return 404; # managed by Certbot


}