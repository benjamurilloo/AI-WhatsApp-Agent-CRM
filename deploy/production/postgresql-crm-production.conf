# Parámetros de costo del planificador para producción (brief-13.1; el método es el de la 9.3, D-2).
# Destino: /etc/postgresql/18/main/conf.d/crm-production.conf
#
# Por qué existe este archivo: los valores por defecto de PostgreSQL describen una máquina que el
# droplet no es (effective_cache_size = 4GB, random_page_cost = 4 sobre SSD), y el planificador
# elige la forma del plan a partir de estos números. El motivo completo está en
# deploy/staging/postgresql-crm-staging.conf. Lo que se lleva de staging es el método, no los
# valores: staging tiene 961 MB y este droplet es otro.
#
# La RAM del droplet productivo, medida con `free -m` el 2026-09-29 (13.1.2): 1967 MB de total, el
# plan de 2 GB de D-1 menos lo que reserva el kernel. La guarda
# (tests/guards/staging-postgres-config.test.ts) lleva ese número como constante, y se actualiza
# en el mismo cambio que este archivo. El valor de abajo se reconfirma con la aplicación corriendo,
# igual que en la 9.3.

# Memoria que el planificador supone disponible para cachear. NO reserva memoria: es solo una
# estimación de costo. Para 1967 MB con la aplicación corriendo: poco más de la mitad.
effective_cache_size = 1GB

# Costo de leer una página fuera de orden. El 4 por defecto es para disco con cabezal; el droplet
# es SSD, como el de staging.
random_page_cost = 1.1

# Lo que este archivo NO toca, a propósito:
#
# - `shared_buffers` (128 MB) y `work_mem` (4 MB) quedan por defecto, como en staging. Cambiarlos
#   es una decisión de rendimiento que se toma con las mediciones de la 13.2, no antes.
