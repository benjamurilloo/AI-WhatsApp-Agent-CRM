# Proxy inverso de produccion (brief-13.1). La aplicacion escucha solo en loopback.
# Es la configuracion de staging (brief-9.1) con el nombre del host productivo: nada mas cambia.
server {
    server_name crm.vixoraai.app;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # REEMPLAZA, no agrega (brief-9.1, D-9). Con $proxy_add_x_forwarded_for una
        # cabecera falsificada por el cliente sobrevive en la cadena; con $remote_addr
        # hay exactamente una entrada y es la IP que vio nginx. La aplicacion lee la
        # ultima entrada (session-cookie.ts:38), asi que un solo salto es la premisa
        # de la que depende H-3: si algun dia se agrega otro proxy delante, esto se
        # revisa antes de desplegarlo.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crm.vixoraai.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.vixoraai.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = crm.vixoraai.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name crm.vixoraai.app;
    return 404; # managed by Certbot


}
