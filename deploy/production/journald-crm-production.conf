# Retención del journal de producción (brief-13.4, D-6).
# Destino: /etc/systemd/journald.conf.d/crm-production.conf
#
# El journal guarda organization_id, user_id y request_id de cada pedido (nunca cuerpos de
# mensajes ni teléfonos, brief-8.2). Se conserva 30 días, lo mismo que la copia externa.
#
# journald borra archivos enteros, no entradas: un archivo se borra cuando su entrada más nueva
# vence. Con el MaxFileSec por defecto, un mes, una entrada viviría hasta casi dos meses. Con un
# archivo por día, vive como mucho 31 días.
#
# Una guarda lo comprueba (tests/guards/production-journald-config.test.ts).

[Journal]
MaxRetentionSec=30day
MaxFileSec=1day
SystemMaxUse=1G
