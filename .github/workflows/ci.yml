# Pipeline de la Fase 2 (docs/decisions/brief-2.5-pipeline-de-ci.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tipos, guardas, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          # Base efímera del runner: no son secretos.
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_ephemeral
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm_ci_ephemeral@127.0.0.1:5432/crm_ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Falla si un schema.ts cambió sin generar su migración (brief-3.1, D-4).
      - name: Migraciones al día con los esquemas
        run: |
          npm run db:generate
          git status --porcelain drizzle/
          test -z "$(git status --porcelain drizzle/)"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formato
        run: npm run format:check

      - name: Guardas (referencias prohibidas y frontera entre módulos)
        run: npm run test:guards

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests de integración (PostgreSQL 18)
        run: npm run test:integration

      - name: Build
        run: npm run build
