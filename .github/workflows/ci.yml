# Pipeline de la Fase 2 (docs/decisions/brief-2.5-pipeline-de-ci.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tipos, guardas, tests y build
    runs-on: ubuntu-latest
    # 15 hasta el 2026-10-11: el primer intento de 50da0be se cortó a los 15 min 12 s
    # con todos los pasos en verde (brief-19.3, §Cierre). Decisión del usuario.
    # 25 hasta el 2026-10-14: la corrida de 0543ef6 tardó 18 min, y su primer intento lo cortó
    # un runner lento (brief-21.4, H-10 y D-12). Decisión del usuario.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          # Base efímera del runner: no son secretos.
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_ephemeral
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm_ci_ephemeral@127.0.0.1:5432/crm_ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Un cambio de solo documentación (todo archivo cambiado termina en .md) corre el formato y
      # las guardas, que también recorren los .md (la de URLs de aviso), y saltea lo demás: el
      # end-to-end y la integración son 25 de los ~29 minutos de una corrida. Decisión del usuario
      # del 2026-10-20, al agotarse los minutos de Actions del mes. Ante la duda (rama nueva,
      # push forzado, base inalcanzable), corre todo.
      - name: Alcance del cambio
        id: alcance
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          codigo=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BASE"; then
            cambiados="$(git diff --name-only "$BASE" HEAD)"
            echo "$cambiados"
            if [ -n "$cambiados" ] && ! echo "$cambiados" | grep -qv '\.md$'; then
              codigo=false
            fi
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Corre todo: $codigo"

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Dos puertas con umbral explícito (brief-8.3, D-1 y D-3): lo que se
      # despliega no admite vulnerabilidades altas ni críticas; el árbol
      # completo, que incluye las herramientas de desarrollo, solo críticas.
      # Los avisos moderados conocidos de la cadena drizzle-kit →
      # @esbuild-kit/esm-loader → esbuild están aceptados por escrito, con su
      # condición de salida, en docs/planning/Risks.md.
      - name: Auditoría de dependencias
        if: steps.alcance.outputs.codigo == 'true'
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      # Falla si un schema.ts cambió sin generar su migración (brief-3.1, D-4).
      - name: Migraciones al día con los esquemas
        if: steps.alcance.outputs.codigo == 'true'
        run: |
          npm run db:generate
          git status --porcelain drizzle/
          test -z "$(git status --porcelain drizzle/)"

      - name: Lint
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run typecheck

      - name: Formato
        run: npm run format:check

      # El detalle de cuáles son vive en tests/guards/, no en este nombre.
      - name: Guardas del repositorio
        run: npm run test:guards

      - name: Tests unitarios
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run test:unit

      - name: Tests de integración (PostgreSQL 18)
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run test:integration

      - name: Build
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run build

      # End-to-end sobre next start y una base <nombre>_e2e (brief-3.5, D-8).
      - name: Instalar Chromium de Playwright
        if: steps.alcance.outputs.codigo == 'true'
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (Chromium)
        id: e2e
        if: steps.alcance.outputs.codigo == 'true'
        run: npm run test:e2e

      # Las trazas que playwright.config.ts retiene al fallar (`retain-on-failure`) viven en
      # test-results/ y se perdían con el runner: sin ellas, un «Target page, context or browser has
      # been closed» no se puede diagnosticar (brief-11.0, O-21). Solo si falló el end-to-end, no
      # un paso anterior. Las trazas llevan solo los datos sintéticos de la base _e2e.
      - name: Subir artefactos de Playwright
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 7
